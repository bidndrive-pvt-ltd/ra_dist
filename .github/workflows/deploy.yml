name: Deploy Frontend Dist

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Deploy frontend dist to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            set -e
            # ================= CONFIG =================
            REPO_DIR="/var/www/ra"          # git repo AND nginx serving dir (same, so we handle the zip carefully)
            ZIP_PATTERN="dist*.zip"
            OWNER="www-data"
            GROUP="www-data"
            # ==========================================
            echo "📁 Moving to repo directory"
            cd "$REPO_DIR"
            echo "📥 Pulling latest code"
            git pull origin main
            echo "🔍 Checking unzip availability"
            if ! command -v unzip >/dev/null 2>&1; then
              echo "📦 unzip not found, installing..."
              sudo apt update
              sudo apt install unzip -y
            fi
            echo "📦 Locating latest dist zip"
            ZIP_FILE=$(ls -t $ZIP_PATTERN 2>/dev/null | head -n 1)
            if [ -z "$ZIP_FILE" ]; then
              echo "❌ No dist zip found"
              exit 1
            fi
            echo "✅ Using zip: $ZIP_FILE"
            echo "🧪 Verifying zip integrity"
            if ! unzip -t "$ZIP_FILE" >/dev/null 2>&1; then
              echo "❌ Zip file is corrupt or unreadable: $ZIP_FILE"
              exit 1
            fi
            echo "📋 Copying zip to safe temp location before cleanup"
            SAFE_ZIP="/tmp/$(basename "$ZIP_FILE")"
            cp "$ZIP_FILE" "$SAFE_ZIP"
            echo "🧹 Cleaning old frontend files (keeping .git)"
            find "$REPO_DIR" -mindepth 1 -maxdepth 1 ! -name '.git' -exec sudo rm -rf {} +
            echo "📦 Extracting dist"
            sudo unzip -o "$SAFE_ZIP" -d "$REPO_DIR"
            echo "👤 Setting ownership"
            sudo chown -R "$OWNER":"$GROUP" "$REPO_DIR"
            sudo chown -R root:root "$REPO_DIR/.git"
            echo "🔐 Setting permissions"
            sudo find "$REPO_DIR" -path "$REPO_DIR/.git" -prune -o -type d -exec chmod 775 {} \;
            sudo find "$REPO_DIR" -path "$REPO_DIR/.git" -prune -o -type f -exec chmod 775 {} \;
            echo "🧽 Cleaning up temp zip"
            rm -f "$SAFE_ZIP"
            echo "🔄 Reloading nginx"
            sudo systemctl reload nginx
            echo "🎉 Frontend deployed successfully"